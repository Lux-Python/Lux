[workspace]
resolver = "2"
members = [
    "crates/lux_cli",
    "crates/lux_core",
    "crates/lux_resolver",
    "crates/lux_cache",
    "crates/lux_sysroot",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Lux Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lux-Python/Lux"


[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
# CLI & Diagnostics
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
miette = { version = "7.4", features = ["fancy"] }
thiserror = "2.0"

# Concurrency & I/O
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "http2", "multipart"] }

# Serialization & Parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
pep440_rs = { version = "0.7.3", features = ["version-ranges"] }
pep508_rs = "0.9.2"
smol_str = { version = "0.3.6", features = ["serde"] }
version-ranges = "0.1.3"

# Algorithms & Memory
id-arena = "2.3"
moka = { version = "0.12", features = ["future"] }
smallvec = { version = "1.16", features = ["serde"] }
ring = "0.17"
miniz_oxide = "0.8"
tempfile = "3"

# Benchmarking

# Internal Workspace Crates
lux_core = { path = "crates/lux_core" }
lux_resolver = { path = "crates/lux_resolver" }
lux_cache = { path = "crates/lux_cache" }
lux_sysroot = { path = "crates/lux_sysroot" }

# Binary Analysis
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "pe", "macho", "archive"] }


[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
